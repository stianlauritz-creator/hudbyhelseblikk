<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hud by Helseblikk">
  <!-- Buen fra logoen — tverrstreken i den spesialtegnede H-en — på nude
       flis, slik brand pad-en viser faviconen. Buen er tegnet inn i denne
       viewBoxen i stedet for å skalere merkevare/hud-bue.svg ned: den
       originalen har stroke-width 7 på 78 enheter bredde, som blir under én
       piksel i fanen. Her er streken 6 enheter på 64, altså ~1,5 px på 16 px.
       Endrer du noe: hold stroke-width på minst 5. Under det brekker buen opp.
       Formen følger originalen — nedbøyningen er 20 % av spennet. -->
  <rect width="64" height="64" rx="12" fill="#ECDDD0"/>
  <path d="M14 28 Q32 42.5 50 28" fill="none" stroke="#8F6B28" stroke-width="6" stroke-linecap="round"/>
</svg>
