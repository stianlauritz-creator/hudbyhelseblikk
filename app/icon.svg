<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hud by Helseblikk">
  <!-- Monogram-H i gull på dyp grønn. Bokstaven er tegnet som rektangler,
       ikke satt i en font, så ikonet ser likt ut overalt uten å laste noe.
       Strekene er bevisst tynne — de blir rundt én piksel i fanen, akkurat
       nok til at H-en henger sammen. Endrer du noe: hold tverrbjelken på
       minst 2,5 enheter. Under det forsvinner den på 16 px, og H-en leses
       som to løse søyler. -->
  <rect width="64" height="64" rx="12" fill="#24382F"/>
  <rect x="18" y="15.5" width="4.5" height="33" fill="#C8A96B"/>
  <rect x="41.5" y="15.5" width="4.5" height="33" fill="#C8A96B"/>
  <rect x="18" y="30.7" width="28" height="2.6" fill="#C8A96B"/>
</svg>
