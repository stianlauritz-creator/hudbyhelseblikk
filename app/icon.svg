  <!-- Monogram-H i krem på klinikkens gull. Bokstaven er den ekte Playfair
       Display-H-en fra ordmerket, hentet ut av fontfilen og lagret som kurve,
       så ikonet trenger ingen font og formen er identisk med logoen.
       To bevisste avvik fra ordmerket, begge for å overleve 16 px i fanen:
       vekt 600 i stedet for 400, og tverrbjelken forsterket fra 1,1 til 2,6
       enheter. Playfairs hårtynne bjelke blir under en halv piksel i fanen,
       og da leses H-en som to løse søyler. -->
